<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Ícono simplificado de notificación: el ciclo (serpiente en anillo) roto en la parte superior. -->
  <g transform="translate(1.2 2) scale(0.9)">
    <!-- Cuerpo: arco grueso de la cabeza (arriba a la derecha) a la cola cortada (arriba a la izquierda). -->
    <path d="M16 5.07 A8 8 0 1 1 8 5.07" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="butt"/>
    <!-- Cabeza -->
    <ellipse cx="16.9" cy="4.6" rx="3" ry="2.2" transform="rotate(-25 16.9 4.6)" fill="#fff"/>
    <!-- Ojo (hueco) -->
    <circle cx="17.6" cy="4" r="0.75" fill="#000"/>
  </g>
</svg>
